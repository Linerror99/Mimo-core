# ==================================================
# MIMO FINANCE - Docker Compose Production
# ==================================================
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ==================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: mimo-postgres-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${DB_USER:-duoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-duoflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - mimo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-duoflow}"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: mimo-redis-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - mimo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mimo-backend-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      DATABASE_URL: postgresql://${DB_USER:-duoflow}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-duoflow}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - mimo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: mimo-frontend-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://backend:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - mimo-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 30s

networks:
  mimo-network:
    driver: bridge
    name: mimo-prod-network

volumes:
  postgres_data:
    name: mimo-postgres-prod-data
  redis_data:
    name: mimo-redis-prod-data
  uploads:
    name: mimo-uploads-prod
  logs:
    name: mimo-logs-prod
