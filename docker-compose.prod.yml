# ==================================================
# MIMO FINANCE - Docker Compose Production
# ==================================================
# 
# Production-ready configuration with:
# - Health checks for all services
# - Restart policies
# - Resource limits
# - Persistent volumes
# - Environment variable injection
# - Security hardening
#
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ==================================================

version: '3.8'

services:
  # ==================================================
  # PostgreSQL Database
  # ==================================================
  postgres:
    image: postgres:15-alpine
    container_name: duoflow-postgres-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    
    environment:
      POSTGRES_USER: ${DB_USER:-duoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-duoflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    ports:
      - "${DB_PORT:-5432}:5432"
    
    networks:
      - duoflow-network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-duoflow}"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Redis Cache
  # ==================================================
  redis:
    image: redis:7-alpine
    container_name: duoflow-redis-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    
    volumes:
      - redis_data:/data
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    networks:
      - duoflow-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 20s
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Backend API (FastAPI)
  # ==================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    
    container_name: duoflow-backend-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    
    environment:
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      
      # Database
      DATABASE_URL: postgresql://${DB_USER:-duoflow}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-duoflow}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-duoflow}
      DB_USER: ${DB_USER:-duoflow}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # JWT & Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_MINUTES: ${JWT_REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      
      # CORS & API
      API_URL: ${API_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://localhost:5173}
      
      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_USER_MINUTE: ${RATE_LIMIT_PER_USER_MINUTE:-30}
      
      # File Uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      UPLOADS_DIR: /app/uploads
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      
      # Production Monitoring (Optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
    
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    
    ports:
      - "${API_PORT:-8000}:8000"
    
    networks:
      - duoflow-network
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          memory: 1G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Frontend (React + Vite)
  # ==================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    
    container_name: duoflow-frontend-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    
    ports:
      - "${FRONTEND_PORT:-5000}:80"
    
    networks:
      - duoflow-network
    
    depends_on:
      backend:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==================================================
# Networks
# ==================================================
networks:
  duoflow-network:
    driver: bridge
    name: duoflow-prod-network

# ==================================================
# Volumes (Persistent Data)
# ==================================================
volumes:
  postgres_data:
    name: duoflow-postgres-prod-data
  redis_data:
    name: duoflow-redis-prod-data
  uploads:
    name: duoflow-uploads-prod
  logs:
    name: duoflow-logs-prod
