steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'backend/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mimo-repo/backend:latest'
      - './backend'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mimo-repo/backend:latest'
images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mimo-repo/backend:latest'
