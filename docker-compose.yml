services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mimo-postgres
    environment:
      POSTGRES_USER: duoflow
      POSTGRES_PASSWORD: duoflow123
      POSTGRES_DB: duoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duoflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mimo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mimo-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mimo-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mimo-backend
    environment:
      - DATABASE_URL=postgresql://duoflow:duoflow123@postgres:5432/duoflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
      - ENVIRONMENT=development
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=lax
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mimo-network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend (Next.js 15 App Router + BFF Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: mimo-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - INTERNAL_API_URL=http://backend:8000/api/v1
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/tests:/app/tests
    depends_on:
      - backend
    networks:
      - mimo-network

volumes:
  postgres_data:
  redis_data:

networks:
  mimo-network:
    driver: bridge
