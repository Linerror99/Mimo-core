name: Deploy to Production

on:
  push:
    branches:
      - staging
      - develop
      - sprint_9

env:
  PROJECT_ID: mimo-finance-production
  REGION: europe-west1
  BACKEND_SERVICE: mimo-backend
  FRONTEND_SERVICE: mimo-frontend
  REPOSITORY: mimo-repo

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/630066653084/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@mimo-finance-production.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Backend Image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest \
            -f backend/Dockerfile.prod \
            backend/
          
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest

      - name: Build and Push Frontend Image
        run: |
          # Get backend URL for frontend env
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          
          docker build \
            --build-arg VITE_API_URL=$BACKEND_URL \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest \
            -f frontend/Dockerfile.prod \
            frontend/
          
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet
          
          echo "Waiting for backend to be ready..."
          sleep 10

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet
          
          echo "Waiting for frontend to be ready..."
          sleep 10

      - name: Update Backend CORS with Frontend URL
        run: |
          # Get frontend URL
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          
          echo "Frontend URL: $FRONTEND_URL"
          
          # Build CORS origins with both possible frontend URLs
          # Cloud Run can have different URL formats depending on the deployment
          CORS_ORIGINS="https://mimo-frontend-7ivz6pjoba-ew.a.run.app,https://mimo-frontend-630066653084.europe-west1.run.app"
          
          # Add the dynamic frontend URL if different from the known ones
          if [[ "$FRONTEND_URL" != *"7ivz6pjoba"* ]] && [[ "$FRONTEND_URL" != *"630066653084"* ]]; then
            CORS_ORIGINS="${CORS_ORIGINS},${FRONTEND_URL}"
          fi
          
          echo "Updating backend CORS to allow: $CORS_ORIGINS"
          
          # Update backend with correct CORS
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --update-env-vars="CORS_ORIGINS=$CORS_ORIGINS" \
            --quiet
          
          echo "CORS updated successfully. Waiting for backend to restart..."
          sleep 15

      # - name: Run Database Migrations
      #   run: |
      #     BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
      #       --region=${{ env.REGION }} \
      #       --format='value(status.url)')
      #     
      #     # Call migration endpoint
      #     RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
      #       -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
      #       "$BACKEND_URL/api/v1/admin/migrate")
      #     
      #     HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      #     BODY=$(echo "$RESPONSE" | sed '$d')
      #     
      #     echo "Migration response: $BODY"
      #     
      #     if [ "$HTTP_CODE" != "200" ]; then
      #       echo "Migration failed with HTTP $HTTP_CODE"
      #       exit 1
      #     fi
      #   test ci

      - name: Smoke Tests
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          
          echo "Testing Backend Health..."
          BACKEND_HEALTH=$(curl -s -w "\n%{http_code}" "$BACKEND_URL/health")
          BACKEND_CODE=$(echo "$BACKEND_HEALTH" | tail -n1)
          
          if [ "$BACKEND_CODE" != "200" ]; then
            echo "Backend health check failed!"
            exit 1
          fi
          echo "✅ Backend is healthy"
          
          echo "Testing Frontend..."
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
          
          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "Frontend check failed!"
            exit 1
          fi
          echo "✅ Frontend is accessible"
          
          echo ""
          echo "🎉 Deployment Successful!"
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "✅ Deployment to production completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Notify Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed!"
          echo "Check the logs above for details"
          exit 1
