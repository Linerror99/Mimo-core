# ================================================================
# MIMO FINANCE - CI Pipeline (Backend FastAPI + Frontend Next.js 15)
# ================================================================
name: CI Pipeline

on:
  push:
    branches: [ main, develop, refonte ]
  pull_request:
    branches: [ main, develop, refonte ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  POSTGRES_VERSION: '15'
  REDIS_VERSION: '7'

jobs:
  # ================================================================
  # Backend Linting
  # ================================================================
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff linter
        working-directory: ./backend
        run: ruff check app/ tests/ --output-format=github

  # ================================================================
  # Backend Unit Tests
  # ================================================================
  backend-tests:
    name: Backend Unit Tests (Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER || 'test_user' }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'test_password' }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME || 'test_db' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER || 'test_user' }}:${{ secrets.TEST_DB_PASSWORD || 'test_password' }}@localhost:5432/${{ secrets.TEST_DB_NAME || 'test_db' }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ${{ secrets.TEST_JWT_SECRET || 'test_secret_key_for_ci_testing_only' }}
          ENVIRONMENT: test
          LOG_DIR: ./logs
          UPLOAD_DIR: ./uploads
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

  # ================================================================
  # Frontend TypeCheck, Lint, Vitest TDD & Next.js Build (Blocking)
  # ================================================================
  frontend-quality:
    name: Frontend TypeCheck, Lint, Vitest & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript strict check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest TDD suite
        working-directory: ./frontend
        run: npm run test:run

      - name: Verify Next.js production build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # ================================================================
  # Build Docker Images
  # ================================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mimo-finance-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend standalone image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: mimo-finance-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # Integration Tests
  # ================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for backend & frontend to be ready
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Run health & UI checks
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/docs
          curl -sf http://localhost:3000/login

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ================================================================
  # Summary
  # ================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend-quality, build-images, integration-tests]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Quality (TSC/Lint/Vitest/Build): ${{ needs.frontend-quality.result }}"
          echo "Build Images: ${{ needs.build-images.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"

          if [[ "${{ needs.backend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.build-images.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
