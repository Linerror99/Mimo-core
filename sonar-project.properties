# ================================================================
# MIMO FINANCE - SonarCloud Configuration
# ================================================================
# 
# Configuration pour l'analyse de qualité du code avec SonarCloud
# https://sonarcloud.io/
#
# ================================================================

# Project identification
# Note: These values can be overridden via workflow parameters
sonar.projectKey=Linerror99_Mimo-core
sonar.organization=linerror99

# Project metadata
sonar.projectName=Mimo Finance
sonar.projectVersion=1.0.0

# ================================================================
# Source Configuration
# ================================================================

# Source directories
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__

# File exclusions (node_modules, migrations, generated files)
sonar.exclusions=\
  **/node_modules/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/alembic/versions/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.next/**

# Test exclusions (don't analyze test files as production code)
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**

# ================================================================
# Python Configuration (Backend)
# ================================================================

# Python version
sonar.python.version=3.12

# Coverage report paths
sonar.python.coverage.reportPaths=backend/coverage.xml

# Pylint report (optional, if you run pylint)
# sonar.python.pylint.reportPaths=backend/pylint-report.txt

# ================================================================
# JavaScript/TypeScript Configuration (Frontend)
# ================================================================

# TypeScript/JavaScript file suffixes
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Coverage report paths
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ESLint report (optional)
# sonar.eslint.reportPaths=frontend/eslint-report.json

# ================================================================
# Code Coverage Configuration
# ================================================================

# Minimum coverage threshold (will fail if below)
sonar.coverage.exclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/migrations/**,\
  **/alembic/versions/**

# ================================================================
# Quality Gate Configuration
# ================================================================

# Quality gate targets (Sprint 9 goal):
# - Coverage: 85% (current: 76%)
# - Duplicated lines: < 3%
# - Maintainability rating: A
# - Reliability rating: A
# - Security rating: A
# Note: Quality Gate is non-blocking for Sprint 8

# ================================================================
# Additional Settings
# ================================================================

# Encoding
sonar.sourceEncoding=UTF-8

# SCM (Git)
sonar.scm.provider=git

# Pull Request decoration
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=Linerror99/Mimo-core

# Branch analysis
sonar.branch.name=${env.GITHUB_REF_NAME}

# Links
sonar.links.homepage=https://github.com/Linerror99/Mimo-core
sonar.links.ci=https://github.com/Linerror99/Mimo-core/actions
sonar.links.scm=https://github.com/Linerror99/Mimo-core
sonar.links.issue=https://github.com/Linerror99/Mimo-core/issues
